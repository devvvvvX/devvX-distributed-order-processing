# ============================================================
# Phase 4 — Docker Compose: Distributed Coordination with Redis
# ============================================================
# 🔍 LEARNING NOTE: Phase 4 infrastructure changes:
#   Phase 1: 2 services (app + postgres)
#   Phase 2: 6 services (app + postgres + kafka + kafka-init + kafka-ui + 1 consumer)
#   Phase 3: 8 services (app + postgres + kafka + kafka-init + kafka-ui + 3 consumers)
#   Phase 4: 9 services (+ Redis)
#
# What changed:
# 1. Added Redis service (coordination layer)
# 2. App gets Redis config → rate limiting, caching, locks, leader election
# 3. Consumers get Redis config → for future use (DLQ replay, etc.)
# 4. App depends on Redis (in addition to Postgres and Kafka)
#
# 🔍 LEARNING NOTE: Redis adds minimal operational overhead compared
# to the value it provides. A single Redis instance handles 100,000+
# operations/second. For our learning setup, it's a 6MB Alpine container.
services:
  # ─────────────────────────────────────────────────
  # PostgreSQL — Our single source of truth
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: op-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orderplatform
      POSTGRES_PASSWORD: orderplatform_dev
      POSTGRES_DB: order_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderplatform -d order_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────
  # Redis — Coordination Layer (Phase 4)
  # ─────────────────────────────────────────────────
  # 🔍 LEARNING NOTE: Redis serves FIVE purposes in our architecture:
  # 1. RATE LIMITING: Shared counters across API instances
  # 2. DISTRIBUTED LOCKS: Mutual exclusion for status updates
  # 3. CACHING: Cache-aside for hot-path order lookups
  # 4. LEADER ELECTION: Only one instance runs the outbox relay
  # 5. ORDER ASSIGNMENT: Atomic driver-to-order coordination
  #
  # We use the Alpine image (6MB) with two key settings:
  # - maxmemory 128mb: Caps Redis memory usage. Without this,
  #   Redis will use all available memory and get OOM-killed.
  # - maxmemory-policy allkeys-lru: When memory is full, evict
  #   the Least Recently Used key. This is safe for our use case
  #   because all our data has TTLs and is regenerable.
  #
  # In production, you'd use:
  # - Redis Cluster (for horizontal scaling)
  # - Redis Sentinel (for high availability failover)
  # - Or a managed service like AWS ElastiCache / GCP Memorystore
  redis:
    image: redis:7-alpine
    container_name: op-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────
  # Kafka — Event Bus (KRaft mode, no ZooKeeper)
  # ─────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: op-kafka
    ports:
      - "29092:9092"
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Log retention
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────
  # Kafka Init — Create Topics
  # ─────────────────────────────────────────────────
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: op-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic order-events \
          --partitions 3 \
          --replication-factor 1
        echo "✅ Created topic: order-events (3 partitions)"

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic order-events-dlq \
          --partitions 1 \
          --replication-factor 1
        echo "✅ Created topic: order-events-dlq (1 partition - Dead Letter Queue)"

        echo ""
        echo "All topics:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
        echo "Done."
    restart: "no"

  # ─────────────────────────────────────────────────
  # Kafka UI — Visual Dashboard
  # ─────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: op-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: order-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ─────────────────────────────────────────────────
  # Order API — HTTP Server + Outbox Relay + Redis
  # ─────────────────────────────────────────────────
  # 🔍 PHASE 4 CHANGE: The app now has SIX responsibilities:
  # 1. Handle HTTP requests (Phase 1-2)
  # 2. Write events to outbox table (Phase 3)
  # 3. Run OutboxRelay — controlled by leader election (Phase 3+4)
  # 4. Rate limit requests via Redis (Phase 4)
  # 5. Cache order lookups via Redis (Phase 4)
  # 6. Cooridnate driver assignment via Redis (Phase 4)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: op-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://orderplatform:orderplatform_dev@postgres:5432/order_platform
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      LOG_LEVEL: debug
      NOTIFICATION_DELAY_MS: 500
      NOTIFICATION_FAILURE_RATE: 0.0
      # Kafka configuration (for outbox relay)
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: order-api
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_DLQ: order-events-dlq
      # Outbox relay configuration (Phase 3)
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 50
      # Redis configuration (Phase 4)
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "op:"
      # Rate limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 30
      # Cache
      CACHE_ORDER_TTL_SECONDS: 60
      # Leader election
      LEADER_ELECTION_LEASE_TTL_MS: 15000
      LEADER_ELECTION_HEARTBEAT_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────────
  # Notification Consumers — Consumer Group (3 instances)
  # ─────────────────────────────────────────────────
  # 🔍 LEARNING NOTE: Consumers don't need Redis for their core function
  # (idempotent event processing). But we pass REDIS_URL so they could
  # use it for future features (e.g., DLQ replay, distributed tracing).
  notification-consumer-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: op-notification-consumer-1
    command: ["node", "dist/consumers/index.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://orderplatform:orderplatform_dev@postgres:5432/order_platform
      DB_POOL_MIN: 1
      DB_POOL_MAX: 3
      LOG_LEVEL: debug
      NOTIFICATION_DELAY_MS: 500
      NOTIFICATION_FAILURE_RATE: 0.0
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-consumer-1
      KAFKA_CONSUMER_GROUP_ID: notification-service
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_DLQ: order-events-dlq
      CONSUMER_MAX_RETRIES: 3
      CONSUMER_RETRY_BASE_DELAY_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  
  # ─────────────────────────────────────────────────
  # Notification Consumer 2
  # ─────────────────────────────────────────────────
  notification-consumer-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: op-notification-consumer-2
    command: ["node", "dist/consumers/index.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://orderplatform:orderplatform_dev@postgres:5432/order_platform
      DB_POOL_MIN: 1
      DB_POOL_MAX: 3
      LOG_LEVEL: debug
      NOTIFICATION_DELAY_MS: 500
      NOTIFICATION_FAILURE_RATE: 0.0
      # Kafka configuration
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-consumer-2
      KAFKA_CONSUMER_GROUP_ID: notification-service
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_DLQ: order-events-dlq
      # Retry configuration (Phase 3)
      CONSUMER_MAX_RETRIES: 3
      CONSUMER_RETRY_BASE_DELAY_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────
  # Notification Consumer 3
  # ─────────────────────────────────────────────────
  notification-consumer-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: op-notification-consumer-3
    command: ["node", "dist/consumers/index.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://orderplatform:orderplatform_dev@postgres:5432/order_platform
      DB_POOL_MIN: 1
      DB_POOL_MAX: 3
      LOG_LEVEL: debug
      NOTIFICATION_DELAY_MS: 500
      NOTIFICATION_FAILURE_RATE: 0.0
      # Kafka configuration
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-consumer-3
      KAFKA_CONSUMER_GROUP_ID: notification-service
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_DLQ: order-events-dlq
      # Retry configuration (Phase 3)
      CONSUMER_MAX_RETRIES: 3
      CONSUMER_RETRY_BASE_DELAY_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local
