# ============================================================
# Phase 3 — Docker Compose: Reliable Distributed Processing
# ============================================================
# 🔍 LEARNING NOTE: Phase 3 infrastructure changes:
#   Phase 1: 2 services (app + postgres)
#   Phase 2: 6 services (app + postgres + kafka + kafka-init + kafka-ui + 1 consumer)
#   Phase 3: 8 services (app + postgres + kafka + kafka-init + kafka-ui + 3 consumers)
#
# What changed:
# 1. kafka-init now creates TWO topics: order-events + order-events-dlq
# 2. The single notification-consumer is now 3 EXPLICIT consumer instances
#    (all sharing the same consumer group → Kafka assigns 1 partition per consumer)
# 3. The app now runs an OutboxRelay (background poller)
# 4. New config vars: DLQ topic, retry settings, outbox polling
#
# 🔍 LEARNING NOTE: Why 3 explicit services instead of `deploy.replicas: 3`?
# - Explicit services have NAMED containers → distinct log streams
# - Each container has a unique KAFKA_CLIENT_ID → easy to identify in Kafka UI
# - You can stop/start individual consumers to observe rebalancing
# - Better for LEARNING because you see each consumer's behavior independently
# In production, you'd use Kubernetes Deployments with replicas.
services:
  # ─────────────────────────────────────────────────
  # PostgreSQL — Our single source of truth
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: op-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orderplatform
      POSTGRES_PASSWORD: orderplatform_dev
      POSTGRES_DB: order_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderplatform -d order_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────
  # Kafka — Event Bus (KRaft mode, no ZooKeeper)
  # ─────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: op-kafka
    ports:
      - "29092:9092"
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Log retention
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────
  # Kafka Init — Create Topics (Phase 3: + DLQ topic)
  # ─────────────────────────────────────────────────
  # 🔍 PHASE 3 CHANGE: Now creates TWO topics:
  #   order-events     — Main event topic (3 partitions)
  #   order-events-dlq — Dead Letter Queue (1 partition)
  #
  # 🔍 LEARNING NOTE: DLQ has only 1 partition because:
  # - DLQ events are rare (only on exhausted retries)
  # - We want ALL DLQ events in one place for easy investigation
  # - No need for parallel processing of DLQ events
  # - Ordering in DLQ is by failure time, not by entity
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: op-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic order-events \
          --partitions 3 \
          --replication-factor 1
        echo "✅ Created topic: order-events (3 partitions)"

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic order-events-dlq \
          --partitions 1 \
          --replication-factor 1
        echo "✅ Created topic: order-events-dlq (1 partition - Dead Letter Queue)"

        echo ""
        echo "All topics:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
        echo "Done."
    restart: "no"

  # ─────────────────────────────────────────────────
  # Kafka UI — Visual Dashboard
  # ─────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: op-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: order-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ─────────────────────────────────────────────────
  # Order API — HTTP Server + Outbox Relay
  # ─────────────────────────────────────────────────
  # 🔍 PHASE 3 CHANGE: The app now has THREE responsibilities:
  # 1. Handle HTTP requests (same as Phase 1-2)
  # 2. Write events to outbox table (atomic with order writes)
  # 3. Run OutboxRelay (polls outbox → publishes to Kafka)
  #
  # The EventProducer is NO LONGER injected into the OrderService.
  # The OrderService only writes to Postgres. The relay handles Kafka.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: op-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://orderplatform:orderplatform_dev@postgres:5432/order_platform
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      LOG_LEVEL: debug
      NOTIFICATION_DELAY_MS: 500
      NOTIFICATION_FAILURE_RATE: 0.0
      # Kafka configuration (for outbox relay)
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: order-api
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_DLQ: order-events-dlq
      # Outbox relay configuration (Phase 3)
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────────
  # Notification Consumers — Consumer Group (3 instances)
  # ─────────────────────────────────────────────────
  # 🔍 PHASE 3 CHANGE: Scaled from 1 consumer to 3 consumers.
  #
  # All 3 share the SAME consumer group ID (notification-service).
  # Kafka assigns each consumer a subset of partitions:
  #   Consumer 1 → Partition 0
  #   Consumer 2 → Partition 1
  #   Consumer 3 → Partition 2
  #
  # 🔍 LEARNING NOTE: CONSUMER GROUP MECHANICS
  #
  # MAX PARALLELISM = min(consumers, partitions)
  # - 3 partitions, 3 consumers → each gets 1 partition (optimal)
  # - 3 partitions, 2 consumers → one consumer gets 2 partitions
  # - 3 partitions, 4 consumers → one consumer sits IDLE (wasted)
  #
  # This is why you choose partition count carefully at topic creation.
  # You can't decrease partitions, and increasing changes key→partition mapping.
  #
  # REBALANCING happens when:
  # - A consumer joins the group (new container starts)
  # - A consumer leaves (container stops or session timeout)
  # - Partitions change (topic altered)
  #
  # During rebalance: ALL consumers in the group STOP processing briefly.
  # This is the most disruptive Kafka operation. Idempotency protects
  # against duplicates caused by rebalancing.
  #
  # EXPERIMENT: Try stopping one consumer and watch Kafka UI!
  #   docker compose stop notification-consumer-2
  #   → Consumer 1 and 3 pick up partition 1
  #   docker compose start notification-consumer-2
  #   → Rebalance: partition 1 goes back to consumer 2
  notification-consumer-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: op-notification-consumer-1
    command: ["node", "dist/consumers/index.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://orderplatform:orderplatform_dev@postgres:5432/order_platform
      DB_POOL_MIN: 1
      DB_POOL_MAX: 3
      LOG_LEVEL: debug
      NOTIFICATION_DELAY_MS: 500
      NOTIFICATION_FAILURE_RATE: 0.0
      # Kafka configuration
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-consumer-1
      KAFKA_CONSUMER_GROUP_ID: notification-service
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_DLQ: order-events-dlq
      # Retry configuration (Phase 3)
      CONSUMER_MAX_RETRIES: 3
      CONSUMER_RETRY_BASE_DELAY_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  
  # ─────────────────────────────────────────────────
  # Notification Consumer 2
  # ─────────────────────────────────────────────────
  notification-consumer-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: op-notification-consumer-2
    command: ["node", "dist/consumers/index.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://orderplatform:orderplatform_dev@postgres:5432/order_platform
      DB_POOL_MIN: 1
      DB_POOL_MAX: 3
      LOG_LEVEL: debug
      NOTIFICATION_DELAY_MS: 500
      NOTIFICATION_FAILURE_RATE: 0.0
      # Kafka configuration
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-consumer-2
      KAFKA_CONSUMER_GROUP_ID: notification-service
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_DLQ: order-events-dlq
      # Retry configuration (Phase 3)
      CONSUMER_MAX_RETRIES: 3
      CONSUMER_RETRY_BASE_DELAY_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────
  # Notification Consumer 3
  # ─────────────────────────────────────────────────
  notification-consumer-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: op-notification-consumer-3
    command: ["node", "dist/consumers/index.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://orderplatform:orderplatform_dev@postgres:5432/order_platform
      DB_POOL_MIN: 1
      DB_POOL_MAX: 3
      LOG_LEVEL: debug
      NOTIFICATION_DELAY_MS: 500
      NOTIFICATION_FAILURE_RATE: 0.0
      # Kafka configuration
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-consumer-3
      KAFKA_CONSUMER_GROUP_ID: notification-service
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_DLQ: order-events-dlq
      # Retry configuration (Phase 3)
      CONSUMER_MAX_RETRIES: 3
      CONSUMER_RETRY_BASE_DELAY_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local
